name: Direct Open - GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build static SPA for GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          npm install
          npm run build -- --base=/aero-skills-launchpad/
          test -f .output/public/_shell.html
          rm -rf _site
          mkdir -p _site
          rsync -a .output/public/ _site/
          cp _site/_shell.html _site/index.html
          cp _site/_shell.html _site/404.html
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
